<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
{% extends 'base.html' %}

{% block title %}
Departments
{% endblock %}

{% block content %}

<h2 class="text-center mb-5">Departments</h2>

<div class="row">

{% for d in dept %}

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body">

<h4>{{ d.department_name }}</h4>

<p>{{ d.department_description }}</p>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}

</body>
</html>
